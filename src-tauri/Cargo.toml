[package]
name = "jianjie"
version = "0.1.0"
description = "见界 · Windows desktop cinema"
authors = ["见界"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "cookies", "charset", "http2", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
futures = "0.3"
tokio = { version = "1", features = ["net", "rt", "time", "sync"] }
