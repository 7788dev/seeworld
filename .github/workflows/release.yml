name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            prototype/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix prototype ci

      - name: Resolve version
        shell: pwsh
        run: |
          $isTag = "${{ github.ref_type }}" -eq 'tag'
          if ($isTag) {
            $version = "${{ github.ref_name }}".TrimStart('v')
            if ($version -notmatch '^\d+\.\d+\.\d+') {
              throw "Tag must look like vX.Y.Z (got ${{ github.ref_name }})"
            }
            # 让 tag 版本覆盖仓库里的默认版本，保证安装包/应用内版本一致。
            $confPath = 'src-tauri/tauri.conf.json'
            $conf = Get-Content $confPath -Raw | ConvertFrom-Json
            $conf.version = $version
            $conf | ConvertTo-Json -Depth 50 | Set-Content -Path $confPath -Encoding utf8
            $cargoPath = 'src-tauri/Cargo.toml'
            $cargo = Get-Content $cargoPath -Raw
            $cargo = $cargo -replace '(?m)^version = "[^"]+"', "version = `"$version`""
            Set-Content -Path $cargoPath -Value $cargo -Encoding utf8
          } else {
            $version = (Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "IS_TAG=$($isTag.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Tests
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build frontend, portable exe and installers
        # tauri build 会同时生成 target/release/jianjie.exe（便携版）
        # 与 bundle/nsis、bundle/msi 安装器。
        run: npm run build

      - name: Collect release assets
        shell: pwsh
        run: |
          $prefix = if ($env:IS_TAG -eq 'true') { "SeeWorld-$env:VERSION" } else { "SeeWorld-nightly" }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          $portable = Get-ChildItem 'src-tauri/target/release' -File -Filter '*.exe' |
            Where-Object { $_.BaseName -eq 'jianjie' } |
            Select-Object -First 1
          if (-not $portable) { throw 'Portable jianjie.exe was not produced' }
          Copy-Item $portable.FullName "release-assets/$prefix-portable.exe"

          $nsis = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -File -Filter '*.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          $msi = Get-ChildItem 'src-tauri/target/release/bundle/msi' -File -Filter '*.msi' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $nsis -and -not $msi) { throw 'No NSIS or MSI installer was produced' }
          if ($nsis) { Copy-Item $nsis.FullName "release-assets/$prefix-setup.exe" }
          if ($msi) { Copy-Item $msi.FullName "release-assets/$prefix.msi" }
          "ASSET_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Get-ChildItem release-assets | Select-Object Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: seeworld-windows-${{ github.run_number }}
          path: release-assets/*
          if-no-files-found: error

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$IS_TAG" = "true" ]; then
            TAG="$GITHUB_REF_NAME"
            TITLE="SeeWorld $GITHUB_REF_NAME"
            PRERELEASE=false
            CHANNEL="正式版 $GITHUB_REF_NAME"
          else
            TAG="nightly"
            TITLE="SeeWorld Nightly"
            PRERELEASE=true
            CHANNEL="Nightly（main 每次推送更新）"
          fi
          BODY=$(cat <<EOF
          ## SeeWorld Windows 构建

          $CHANNEL
          提交：\`${GITHUB_SHA::7}\`

          ### 下载
          - \`${ASSET_PREFIX:-SeeWorld}-portable.exe\` — 免安装版，解压即用
          - \`${ASSET_PREFIX:-SeeWorld}-setup.exe\` — NSIS 安装器（推荐）
          - \`${ASSET_PREFIX:-SeeWorld}.msi\` — MSI 安装包

          适用于 Windows 10 / 11 x64。Windows 11 自带 WebView2；Windows 10 若缺失会由安装器提示安装。

          > 当前构建未签名，首次运行可能出现 Windows SmartScreen 提示。
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            if [ "$PRERELEASE" = "true" ]; then
              gh release edit "$TAG" --title "$TITLE" --notes "$BODY" --prerelease
            else
              gh release edit "$TAG" --title "$TITLE" --notes "$BODY" --prerelease=false --latest
            fi
          else
            if [ "$PRERELEASE" = "true" ]; then
              gh release create "$TAG" release-assets/* --title "$TITLE" --notes "$BODY" --prerelease --target "$GITHUB_SHA"
            else
              gh release create "$TAG" release-assets/* --title "$TITLE" --notes "$BODY" --latest
            fi
          fi
          # 让 nightly tag 指向本次构建，避免 Release 的源码快照停留在第一次构建。
          if [ "$PRERELEASE" = "true" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null 2>&1 || true
          fi